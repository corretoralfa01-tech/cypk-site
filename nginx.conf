server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # o Traefik do Coolify termina o TLS; aqui só o conteúdo
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # No nginx, um add_header dentro de um location CANCELA todos os do nível de
  # cima. Por isso os cabeçalhos de segurança entram por include em cada bloco,
  # em vez de declarados uma vez só no server.
  include /etc/nginx/snippets/seguranca.conf;

  # imagens têm nome estável e mudam por deploy: cache longo
  location /assets/ {
    expires 30d;
    include /etc/nginx/snippets/seguranca.conf;
  }

  location = /index.html {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    include /etc/nginx/snippets/seguranca.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
